[project]
name = "mcp-agent-docparser"
version = "0.1.0"
description = "MCP server for the docparser pipeline — fetch → extract → emit SDK documentation as clean markdown."
readme = "README.md"
authors = [
    { name = "Christof Milius" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "mcp[cli]>=2.0.0",
    "playwright>=1.62.0",
    "requests>=2.34.2",
]

[project.scripts]
mcp-agent-docparser = "mcp_agent_docparser:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = [".venv", "doc_output"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["mcp_agent_docparser"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]